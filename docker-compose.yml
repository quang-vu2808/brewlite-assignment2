name: brewlite-assignment2-stack

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: brewlite_assignment2_stack
      POSTGRES_USER: brewlite_stack
      POSTGRES_PASSWORD: ${STACK_DB_PASSWORD:?Set STACK_DB_PASSWORD in the local .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    init: true
    build:
      context: ./apps/api
    environment:
      PORT: "3001"
      WEB_ORIGIN: http://localhost:${STACK_WEB_PORT:-3080}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: brewlite_assignment2_stack
      DB_USER: brewlite_stack
      DB_PASSWORD: ${STACK_DB_PASSWORD:?Set STACK_DB_PASSWORD in the local .env}
      JWT_SECRET: ${STACK_JWT_SECRET:?Set STACK_JWT_SECRET in the local .env}
      PAYMENT_DEMO_ENABLED: "true"
    ports:
      - "127.0.0.1:${STACK_API_PORT:-3081}:3001"
    networks:
      - frontend
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${STACK_API_PORT:-3081}
    ports:
      - "127.0.0.1:${STACK_WEB_PORT:-3080}:3000"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s

networks:
  frontend:
  database:
    internal: true

volumes:
  pgdata:
